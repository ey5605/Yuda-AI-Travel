<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuda AI Travel Planner</title>
    <style>
      @keyframes fadeInOut {
        0%, 100% { opacity: 0; transform: translateY(-20px); }
        10%, 90% { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-out {
        animation: fadeInOut 3s ease-in-out forwards;
      }
      
      @media print {
        /* General Resets */
        body {
          margin: 0;
          padding: 1rem;
          background-color: #fff !important;
          font-size: 11pt;
          -webkit-print-color-adjust: exact;
          color-adjust: exact;
        }

        /* Hide non-printable elements */
        header, 
        #trip-form-section, 
        #trip-actions, 
        #map-overview, 
        #loading-indicator,
        #error-message,
        .image-source-link,
        [aria-modal="true"] {
          display: none !important;
        }

        /* Main container adjustments */
        .container {
          padding: 0 !important;
          margin: 0 !important;
          max-width: 100% !important;
          background-color: transparent !important;
        }
        
        /* Printable content block adjustments */
        .printable-content {
          box-shadow: none !important;
          border: none !important;
          margin-top: 0 !important;
        }

        /* Collage specific styling */
        .collage-container {
          box-shadow: none !important;
          transform: none !important;
          padding: 0 !important;
          border: 1px solid #e5e7eb;
          page-break-after: avoid !important;
          margin-bottom: 1.5rem !important;
        }
        .collage-container img {
          max-height: 240px !important;
          width: 100% !important;
          object-fit: cover !important;
          aspect-ratio: 16/9 !important;
        }
        
        #trip-visualization h2 {
           font-size: 24pt !important;
        }

        /* Card styling */
        .location-card {
          page-break-inside: avoid !important;
          box-shadow: none !important;
          transform: none !important;
          border: 1px solid #e5e7eb;
        }
        .location-card p {
            height: auto !important; /* Allow description to have full height */
        }
        
        /* Grid layout for print */
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          gap: 1.5rem !important;
        }

        /* Avoid breaks inside headings */
        h2, h3 {
          page-break-after: avoid !important;
        }

        /* Remove "external link" icons and underlines from links */
        a {
            text-decoration: none !important;
            color: inherit !important;
        }
        a svg {
            display: none !important;
        }
        a[href]:after {
          content: "" !important;
        }
      }
    </style>
    <script>
      window.global = window;
      window.process = window.process || { env: {} };
      window.addEventListener('error', function(event) {
        var loader = document.getElementById('app-boot-loader');
        if (loader) {
          loader.innerHTML = '<div style="max-width: 520px; margin: 40px auto; padding: 24px; background: white; border-radius: 20px; border: 1px solid #fee2e2; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; font-family: system-ui, sans-serif;">' +
            '<div style="font-size: 40px; margin-bottom: 12px;">⚠️</div>' +
            '<h2 style="color: #991b1b; margin: 0 0 8px 0; font-size: 20px; font-weight: bold;">שגיאה בטעינת האפליקציה</h2>' +
            '<p style="color: #4b5563; font-size: 14px; margin: 0 0 16px 0; line-height: 1.5;">' + (event.message || 'An error occurred while loading the app scripts.') + '</p>' +
            '<button onclick="window.location.reload()" style="background: #4f46e5; color: white; border: none; padding: 10px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px;">טען מחדש / Reload</button>' +
          '</div>';
        }
      });
    </script>
  </head>
  <body class="bg-gray-100">
    <div id="root">
      <div id="app-boot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background-color: #f8fafc; color: #4f46e5; text-align: center; padding: 20px;">
        <div style="width: 44px; height: 44px; border: 4px solid #e0e7ff; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <p style="font-weight: 800; font-size: 18px; color: #1e293b; margin: 0;">טוען את מתכנן הטיולים של יודא...</p>
        <p style="font-size: 13px; color: #64748b; margin-top: 6px;">Loading Yuda AI Travel Planner...</p>
      </div>
    </div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
